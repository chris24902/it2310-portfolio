<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab 6 – CSS Box Model (Part 4 - Step 4)</title>

  <style>
    /* ===========================
       Universal box-sizing reset
       (STEP 4: RESTORED)
    ============================ */
    * {
      box-sizing: border-box;
    }

    /* General box styling */
    .box {
      width: 300px;          /* stays the same */
      padding: 20px;
      margin: 20px 0;
      background-color: #d9d9d9;
      border: 5px solid blue;
    }

    /* Experimental box */
    .experiment {
      width: 300px;
      padding: 20px;
      margin: 20px 0;
      background-color: #d9d9d9;
      border: 4px solid green;
    }
  </style>
</head>
<body>
  <h1>CSS Box Model Lab</h1>

  <div class="box">
    <p>This is Box 1. It demonstrates the CSS Box Model.</p>
  </div>

  <div class="box">
    <p>This is Box 2. Notice the margin between boxes.</p>
  </div>

  <div class="experiment">
    <p>This is Box 3. It has additional experimental styles.</p>
  </div>
</body>
</html>
